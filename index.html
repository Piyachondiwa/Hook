<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Moonwood - Pixel Fantasy RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12}
#stage{position:relative;width:100vw;height:100vh}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;pointer-events:none;color:#fff;font-family:Prompt,sans-serif;text-shadow:0 2px 3px #000}
.status{position:absolute;top:3.9%;left:2.2%;width:260px;padding:10px 14px 11px;background:rgba(13,20,32,.91);border:1px solid rgba(216,200,140,.45);box-sizing:border-box}
.bar{height:9px;background:#30212a;margin-bottom:8px}.bar i{display:block;width:78%;height:100%;background:#d15e70}
.title{font-family:Cinzel,serif;font-size:17px;font-weight:700;letter-spacing:2px}.chapter{position:absolute;top:4%;right:2.5%;font-family:Cinzel,serif;font-size:16px;font-weight:600;letter-spacing:1px;text-align:right}.type{font-size:13px;margin-top:3px;letter-spacing:1px}
.hint{position:absolute;bottom:2.8%;left:2.5%;font-size:13px;font-weight:500;letter-spacing:.4px}
.notice{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);min-width:420px;max-width:80%;padding:11px 18px;background:rgba(11,16,25,.91);border:1px solid rgba(216,200,140,.35);text-align:center;font-size:14px;box-sizing:border-box}
.dialogue{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:min(760px,88%);padding:20px 24px 16px;background:rgba(16,24,39,.96);border:1px solid rgba(216,200,140,.65);box-shadow:0 8px 30px rgba(0,0,0,.45);box-sizing:border-box;font-size:17px;line-height:1.55}.continue{display:block;margin-top:10px;color:#d8c88c;font-family:Cinzel,serif;font-size:12px;letter-spacing:1px}
@media(max-width:700px){.status{width:210px;padding:7px 10px}.title{font-size:13px}.chapter{font-size:12px}.type{font-size:10px}.hint{font-size:10px}.notice{font-size:11px;min-width:0;width:80%}.dialogue{font-size:13px;padding:13px 16px}.continue{font-size:10px}}
</style>
</head>
<body><div id="stage"><canvas id="game" width="320" height="180"></canvas><div id="ui"><div class="status"><div class="bar"><i></i></div><div class="title">MOONWOOD</div></div><div class="chapter" id="chapter"></div><div class="hint">WASD / ARROWS &nbsp; MOVE</div><div class="notice" id="notice"></div><div class="dialogue" id="dialogue" hidden></div></div></div><script src="game.js"></script></body></html>
