name: Moonwood browser smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p test-results
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/moonwood-server.log 2>&1 &
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moonwood-browser-smoke
          path: test-results/moonwood-*.png
          if-no-files-found: warn
